<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>批量分析 · CommentPulse</title><link rel="stylesheet" href="/static/style.css"><style>
main{max-width:1100px;margin:30px auto;padding:20px}input,textarea,select{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:12px;border-radius:8px}textarea{width:100%;box-sizing:border-box}button{cursor:pointer;padding:10px 16px;margin:4px;border-radius:8px;border:1px solid var(--border);background:var(--accent);color:#fff;font-weight:600}button:disabled{cursor:default;opacity:.45}button:hover:not(:disabled){filter:brightness(1.12)}#candidates{max-height:520px;overflow:auto;margin-top:16px}input[type=checkbox]{accent-color:var(--accent)}article{padding:14px;border-bottom:1px solid var(--border)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}#batchError{color:#e86f70;white-space:pre-wrap}table{width:100%}td,th{padding:12px;text-align:left}a{color:var(--accent)}label{cursor:pointer}section{margin:24px 0}.reason{font-size:.85rem;margin-left:24px}#progressText{white-space:pre-wrap}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;width:min(1500px,96vw);max-height:95vh;padding:24px}dialog::backdrop{background:#0009}dialog blockquote{border-left:3px solid var(--accent);padding:12px;margin:12px 0;white-space:pre-wrap}dialog summary{cursor:pointer}#closeDetail{position:sticky;top:0;float:right}#batchRows button{white-space:nowrap}#detailFrame{display:block;width:100%;height:80vh;border:0;border-radius:10px}#closeDetail{float:none;display:block;margin-left:auto}</style></head><body><main><a href="/">← 单视频分析</a><h1>批量视频分析</h1><p class="muted">选择视频，比较评论反馈，导出可独立打开的 HTML 报告。结果仅保留在当前页面，刷新前请导出。</p>
<section class="panel"><h2>1. 添加视频</h2><div class="row"><input id="channelInput" placeholder="YouTube 频道链接或 @账号" aria-label="频道链接" style="flex:1"><label>查看最近 <select id="scanLimit"><option>10</option><option selected>30</option><option>50</option></select> 条</label><button id="loadChannel">读取频道</button></div><p>或粘贴自选视频链接，每行一个（最多 10 条，可跨创作者）</p><textarea id="videoUrls" rows="3" aria-label="自选视频链接"></textarea><button id="addUrls">使用这些视频</button></section>
<p id="batchError" role="alert" hidden></p>
<section id="selection" class="panel" hidden><h2>2. 确认视频</h2><p id="sourceNote"></p><div class="row"><button id="latestTen">选最近 10 条</button><button id="screenAds">AI 初筛疑似广告（调用 DeepSeek）</button><button id="latestAds" disabled>选最近 5 条疑似广告</button><button id="clearSelection">取消全选</button></div><p class="muted">AI 仅阅读标题和简介，不观看视频；疑似广告并不代表已证实商业合作。请核对依据并勾选确认。仅在本次读取的范围内筛选，可能不足 5 条。</p><div id="candidates"></div><p id="selectedCount"></p><button id="runBatch">分析选中视频</button></section>
<section id="batchOutput" class="panel" hidden><h2>3. 分析结果</h2><p id="progressText" aria-live="polite"></p><div class="row"><button id="stopBatch" hidden>当前视频结束后停止</button><button id="retryBatch" hidden>重试失败／继续未完成视频</button><button id="deepBatch" disabled>生成各视频 AI 主题总结</button><button id="exportReport" disabled>导出 HTML 报告</button></div><p class="muted">按顺序分析，每条可能需要约一分钟。普通分析不调用 DeepSeek；主题总结为可选付费操作，按高赞评论样本生成，失败可再次点击补全。</p><div style="overflow:auto"><table><thead><tr><th>视频</th><th>浏览量</th><th>视频点赞</th><th>状态</th><th>评论样本</th><th>正面</th><th>中性</th><th>负面</th></tr></thead><tbody id="batchRows"></tbody></table></div><div id="detail"></div></section>
<dialog id="detailDialog" aria-label="单视频完整分析详情"><button id="closeDetail" type="button">关闭详情</button><div id="modalDetail"></div></dialog></main><script src="/static/batch.js"></script></body></html>
